app:

    # informe a classe do pvc onde serao criados os volumes do SEI
    # deve estar pre-instalado no seu kubernetes um provisionador nfs
    # gluster ou outro. No caso do docker-desktop ja existe um provisionador
    # automatico que cria uma pasta na vm do host ou do linux wsl. Para isso deixe
    # o storageclass vazio
    # caso contrario tera q criar o pv manualmente
    storage:
        #storageClass: nfs-client
        storageClass: ""

    imagePhp:
        repository: ghcr.io/pengovbr/sei-helm/php
        pullPolicy: IfNotPresent
        tag: 0.5.0
        # secret cadastrado no kube para o registry
        secret: secregistry

    imageCron:
        repository: ghcr.io/pengovbr/sei-helm/php-cron
        pullPolicy: IfNotPresent
        tag: 0.5.0
        # secret cadastrado no kube para o registry
        secret: secregistry

    imageWeb:
        repository: ghcr.io/pengovbr/sei-helm/apache
        pullPolicy: IfNotPresent
        tag: 0.5.0
        # secret cadastrado no kube para o registry
        secret: secregistry

    imageInstall:
        repository: ghcr.io/pengovbr/sei-helm/php-install
        pullPolicy: IfNotPresent
        tag: 0.5.0
        # secret cadastrado no kube para o registry
        secret: secregistry


    pvc:
      # caso queira usar um seletor no pvc
      # para fazer o bind no PV, use como ex abaixo
      # seletor atual desabilidado
      selector: {}
      # para habilitar seque exemplo abaixo
      # Ex:
      # selector:
      #   matchLabels:
      #     purpose: app



    nameOverride: ""
    fullnameOverride: ""

    ingress:
        proxyBodySize: 510m

        # Nome do secret com o certificado TLS para o ingress.
        # Crie esse secret com antecedencia para o ingress caso
        # nao possua uma ferramenta emissora.
        # Adicione no formato crt e key padrao para ingress do kube
        tls_secret_name: "mysecret"

        # anotacoes opcionais, renomeie de zopcionais para opcionais,
        # apos isso, todos as anotacoes listadas serao publicadas no ingress
        # alem dos exemplos abaixo, vc pode informar as suas especificas
        zopcionais:
            #cert-manager.io/cluster-issuer: letsencrypt-dth
            #kubernetes.io/ingress.class: nginx
            #kubernetes.io/tls-acme: "true"
            #nginx.ingress.kubernetes.io/affinity: cookie1
            #nginx.ingress.kubernetes.io/session-cookie-name: PIINGRESSAFFINITY

    # endereco (nome) onde encontram-se os servicos externos
    servicoExterno:
        db: dbhostname
        jod: jodhostname
        solr: solrhostname
        memcached: memcachedhostname
        # nome ou ip
        mail: mailhostname
        ldap: ldaphostname

    tz: America/Sao_Paulo

    install:

        # id identificador do ambiente
        # Numero unico para diferenciar as bases solr e banco
        # ATENCAO PRESTAR ATENCAO NESTA STRING
        # as bases de dados sei e solr terao esse id no nome
        # caso instale o mesmo id com a opcao de reconstruir o banco, a automacao ira apagar os dados
        idInstalacao: "orgao1"

        db:

            sipDbName: "siporg1"
            seiDbName: "seiorg1"
            sipUser: "usiporg1"
            sipPassword: "usiporg1"
            seiUser: "useiorg1"
            seiPassword: "useiorg1"


            # se enable vai criar um database para o sei e sip no banco
            # se disable crie manualmente seguindo a nomenclatura do instalador
            criarDatabases: true

            # indica se a automacao irah dropar e criar a base de dados
            # que foi informada para essa instancia
            apagarDatabases: true


        solr:
            # enable: true vai montar um job no namespace do solr informado
            # e criar os indices para esta instancia
            # caso nao deseje essa automacao coloque false e provisione os indices manualmente
            enable: true
            # Necessario para o instalador criar indice no solr para esta instancia
            namespace: solrnamespace

            # obrigatorio aqui informar os nomes dos indices, mesmo que
            # vc marque enable: false, acima
            idxProtocolo: org1sei-protocolos
            idxBaseConhecimento: org1sei-base-conhecimento
            idxPublicacoes: org1sei-publicacoes

            # tempos de commit dos indices
            # obrigatorio mesmo que enable: false, acima
            idxProtocoloTime: 150
            idxBaseConhecimentoTime: 300
            idxPublicacoesTime: 300

            # usuario e senha que o sei vai usar para acesar o solr
            # obrigatorio mesmo que enable: false, acima
            username: org1solr
            password: org1solrp


        # se enable roda o instalador do sei a primeira vez q o ambiente subir
        # para instalar o sei
        # se desabilitado vc tera q rodar manualmente os instaladores
        seiInstaladorInicial: true

        ldap:
            # se true vai habilitar o orgao 0 no ldap
            enable: false
            # nome descritivo para o servidor (tela de cadastro de servidor ldap)
            nome: meuLdap
            # LDAP ou AD
            tipo: LDAP
            # nao altere, vai usar o servico ldap, o nome ou ip vai buscar do app.servicoExterno
            # definido mais acima
            endereco: ldap
            porta: 389
            sufixo:
            usuarioPesquisa: "cn=admin,dc=pen,dc=gov,dc=br"
            senhaPesquisa: "entrecomsenhadoldap"
            contextoPesquisa: "dc=pen,dc=gov,dc=br"
            filtroPesquisa: uid
            retornoPesquisa: distinguishedName
            # versao do AD ou ldap
            numeroVersao: 3


    host: meusei.br
    orgao: ORGAO1
    orgao_descricao: Orgao Helm1
    nome_complemento: Orgao Helm1
    memcached_host: memcached
    # indica se o memcached armazena a sessao do php, dispensando o sticky session
    memcached_session: "true"
    db_tipo: MySql
    db_host: db
    solr_url: http://solr:8983/solr
    solr_tempo_commit_protocolos: 30
    solr_tempo_commit_base_conhecimento: 300
    solr_tempo_commit_publicacoes: 300
    mail_tipo: 2
    mail_servidor: mail
    mail_codificacao: 8bit
    mail_maxdestinatarios: 999
