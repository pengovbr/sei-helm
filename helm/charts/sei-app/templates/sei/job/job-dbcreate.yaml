{{- if .Values.app.install.db.enable }}
apiVersion: batch/v1
kind: Job
metadata:
  name: job-dbcreate
  labels:
    {{- include "sei-app.labels" . | nindent 4 }}
spec:
  backoffLimit: 2
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        job-name: job-dbcreate
        {{- include "sei-app.labels" . | nindent 8 }}
    spec:
      imagePullSecrets:
      - name: {{ .Values.app.imageInstall.secret }}
      containers:
      - command:
        - /automationscripts/dbcreate.sh
        env:
          - name: ID_INSTALACAO
            value: {{ .Values.app.install.idInstalacao | quote }}
        envFrom:
        - configMapRef:
            name: cm-php
        - secretRef:
            name: se-php
        image: {{ .Values.app.imageInstall.repository }}:{{ .Values.app.imageInstall.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.app.imageInstall.pullPolicy }}
        name: job-dbcreate
        stdin: true
        tty: true
        volumeMounts:
        - mountPath: /automationscripts
          name: dbcreate
        - mountPath: /var/lib/sei
          name: vol-sei
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      volumes:
      - name: dbcreate
        configMap:
          name: cm-dbcreate
          defaultMode: 0755
      - name: vol-sei
        persistentVolumeClaim:
          claimName: vol-sei
{{- end }}