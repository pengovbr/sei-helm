apiVersion: batch/v1
kind: Job
metadata:
  name: job-initial
  labels:
    {{- include "sei-app.labels" . | nindent 4 }}
spec:
  backoffLimit: 2
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        job-name: job-initial
        {{- include "sei-app.labels" . | nindent 8 }}
    spec:
      containers:
      - command:
        - /automationscripts/instalar.sh
        envFrom:
        - configMapRef:
            name: cm-php
        - secretRef:
            name: se-php
        image: ghcr.io/pengovbr/sei-helm/php-install:0.5.0
        imagePullPolicy: {{ .Values.app.image.pullPolicy }}
        name: job-initial
        stdin: true
        tty: true
        volumeMounts:
        - mountPath: /automationscripts
          name: sei-install
        - mountPath: /var/lib/sei
          name: vol-sei
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      volumes:
      - name: sei-install
        configMap:
          name: cm-initial
          defaultMode: 0755
      - name: vol-sei
        persistentVolumeClaim:
          claimName: vol-sei
