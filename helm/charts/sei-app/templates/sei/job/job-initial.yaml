{{- if .Values.app.install.sei.enable }}
apiVersion: batch/v1
kind: Job
metadata:
  name: job-initial
  labels:
    {{- include "sei-app.labels" . | nindent 4 }}
spec:
  backoffLimit: 2
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        job-name: job-initial
        {{- include "sei-app.labels" . | nindent 8 }}
    spec:
      imagePullSecrets:
      - name: {{ .Values.app.imageInstall.secret }}
      containers:
      - command:
        - /automationscripts/instalar.sh
        envFrom:
        - configMapRef:
            name: cm-php
        image:  {{ .Values.app.imageInstall.repository }}:{{ .Values.app.imageInstall.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.app.imageInstall.pullPolicy }}
        name: job-initial
        stdin: true
        tty: true
        volumeMounts:
        - mountPath: /automationscripts/instalar.sh
          name: sei-install
          subPath: instalar.sh
        - mountPath: /automationscripts/ldap/sip-config-openldap.php
          name: sei-install
          subPath: sip-config-openldap.php
        - mountPath: /opt/sei/config/ConfiguracaoSEI.php
          name: se-php-files
          subPath: ConfiguracaoSEI.php
        - mountPath: /opt/sip/config/ConfiguracaoSip.php
          name: se-php-files
          subPath: ConfiguracaoSip.php
        - mountPath: /var/lib/sei
          name: vol-sei
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      volumes:
      - name: se-php-files
        secret:
          secretName: se-php-files
          items:
          - key: seiConfiguracao.php
            path: ConfiguracaoSEI.php
          - key: sipConfiguracao.php
            path: ConfiguracaoSip.php
          defaultMode: 0400
      - name: sei-install
        configMap:
          name: cm-initial
          defaultMode: 0755
      - name: vol-sei
        persistentVolumeClaim:
          claimName: vol-sei
{{- end }}