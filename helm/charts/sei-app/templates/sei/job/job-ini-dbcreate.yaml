apiVersion: batch/v1
kind: Job
metadata:
  name: job-ini-dbcreate
  labels:
    {{- include "sei-app.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        job-name: job-ini-dbcreate
        {{- include "sei-app.labels" . | nindent 8 }}
    spec:
      imagePullSecrets:
      - name: {{ .Values.app.imageInstall.secret }}
      containers:
      - command:
        - /automationscripts/dbcreate.sh
        envFrom:
        - configMapRef:
            name: cm-php
        image: {{ .Values.app.imageInstall.repository }}:{{ .Values.app.imageInstall.tag }}
        imagePullPolicy: {{ .Values.app.imageInstall.pullPolicy }}
        name: job-ini-dbcreate
        stdin: true
        tty: true
        volumeMounts:
        - mountPath: /automationscripts/dbcreate.sh
          name: se-php-install-files
          subPath: dbcreate.sh
        - mountPath: /var/lib/sei
          name: vol-sei
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      volumes:
      - name: se-php-install-files
        secret:
          secretName: se-php-install-files
          items:
          - key: dbcreate.sh
            path: dbcreate.sh
          defaultMode: 0500
      - name: vol-sei
        persistentVolumeClaim:
          claimName: vol-sei