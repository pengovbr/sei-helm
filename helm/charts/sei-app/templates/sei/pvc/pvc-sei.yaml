apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vol-sei
  labels:
    {{- include "sei-app.labels" . | nindent 4 }}
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 21Gi
  {{- with .Values.app.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}