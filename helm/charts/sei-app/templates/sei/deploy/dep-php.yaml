apiVersion: apps/v1
kind: Deployment
metadata:
  name: php
  labels:
    {{- include "sei-app.labels" . | nindent 4 }}
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      servico: php
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        servico: php
        {{- include "sei-app.labels" . | nindent 8 }}
    spec:
      imagePullSecrets:
      - name: {{ .Values.app.imagePhp.secret }}
      containers:
      - envFrom:
        #- /entrypoint.sh
        #envFrom:
        - configMapRef:
            name: cm-php
            optional: false
        image: {{ .Values.app.imagePhp.repository }}:{{ .Values.app.imagePhp.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.app.imagePhp.pullPolicy }}
        name: php
        resources:
          requests:
            cpu: 500m
        # livenessProbe:
        #   exec:
        #     command:
        #     - sh
        #     - -c
        #     - curl -s -L localhost/sei | grep frmLogin
        #   failureThreshold: 5
        #   initialDelaySeconds: 10
        #   periodSeconds: 20
        #   successThreshold: 1
        #   timeoutSeconds: 20
        # readinessProbe:
        #   exec:
        #     command:
        #     - sh
        #     - -c
        #     - curl -s -L localhost/sei | grep frmLogin
        #   failureThreshold: 5
        #   initialDelaySeconds: 10
        #   periodSeconds: 20
        #   successThreshold: 1
        #   timeoutSeconds: 20
        startupProbe:
          exec:
            command:
            - sh
            - '-c'
            - ls /var/lib/sei/dbcontrol/modulos-install.ok
          failureThreshold: 100
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        stdin: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        tty: true
        volumeMounts:
        - mountPath: /etc/php82/conf.d/zzz-sei.ini
          name: phpconf
          subPath: zzz-sei.ini
        - mountPath: /etc/php82/php-fpm.d/zzz-sei-fpm.conf
          name: phpconf
          subPath: zzz-sei-fpm.conf
        - mountPath: /opt/sei/config/ConfiguracaoSEI.php
          name: se-php-files
          subPath: ConfiguracaoSEI.php
        - mountPath: /opt/sip/config/ConfiguracaoSip.php
          name: se-php-files
          subPath: ConfiguracaoSip.php
        - mountPath: /var/lib/sei
          name: vol-sei
        - mountPath: /opt/sei/config/mod-pen/certificado.pem
          name: se-php-files
          subPath: certificado.pem
        - mountPath: /opt/sei/config/mod-pen/ConfiguracaoModPEN.php
          name: se-php-files
          subPath: ConfiguracaoModPEN.php
        - mountPath: /opt/sei/config/mod-assinatura-eletronica/ConfiguracaoModAssinaturaEletronica.php
          name: se-php-files
          subPath: ConfiguracaoModAssinaturaEletronica.php
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
      - name: se-php-files
        secret:
          secretName: se-php-files
          items:
          - key: modPenCertificado.pem
            path: certificado.pem
          - key: modPenConfiguracaoModPen.php
            path: ConfiguracaoModPEN.php
          - key: modAssinatura.php
            path: ConfiguracaoModAssinaturaEletronica.php
          - key: seiConfiguracao.php
            path: ConfiguracaoSEI.php
          - key: sipConfiguracao.php
            path: ConfiguracaoSip.php
          defaultMode: 0444
      - name: seiconf
        configMap:
          name: cm-seiconfig
      - name: phpconf
        configMap:
          name: cm-phpconf
      - name: vol-sei
        persistentVolumeClaim:
          claimName: vol-sei

