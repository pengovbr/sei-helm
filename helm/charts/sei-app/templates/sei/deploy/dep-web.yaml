apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "sei-app.labels" . | nindent 4 }}
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      servico: web
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        servico: web
        {{- include "sei-app.labels" . | nindent 8 }}
    spec:
      imagePullSecrets:
      - name: {{ .Values.app.imageWeb.secret }}
      containers:
      - envFrom:
        #- /entrypoint.sh
        #envFrom:
        - configMapRef:
            name: cm-php
            optional: false
        image: {{ .Values.app.imageWeb.repository }}:{{ .Values.app.imageWeb.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.app.imageWeb.pullPolicy }}
        name: web
        resources:
          requests:
            cpu: 500m
        # livenessProbe:
        #   exec:
        #     command:
        #     - sh
        #     - -c
        #     - curl -s -L localhost/sei | grep frmLogin
        #   failureThreshold: 5
        #   initialDelaySeconds: 10
        #   periodSeconds: 20
        #   successThreshold: 1
        #   timeoutSeconds: 20
        # readinessProbe:
        #   exec:
        #     command:
        #     - sh
        #     - -c
        #     - curl -s -L localhost/sei | grep frmLogin
        #   failureThreshold: 5
        #   initialDelaySeconds: 10
        #   periodSeconds: 20
        #   successThreshold: 1
        #   timeoutSeconds: 20
        startupProbe:
          exec:
            command:
            - sh
            - '-c'
            - nc -zv php 9000
          failureThreshold: 100
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        stdin: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        tty: true
        volumeMounts:
        - mountPath: /etc/apache2/conf.d/zzz-sei.conf
          name: seiconf
          subPath: zzz-sei.conf
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
      - name: seiconf
        configMap:
          name: cm-apache