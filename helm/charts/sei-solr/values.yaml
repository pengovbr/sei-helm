solr:

    # informe a classe do pvc onde sera criado o volume do solr
    # deve estar pre-instalado no seu kubernetes um provisionador nfs
    # gluster ou outro. No caso do docker-desktop ja existe um provisionador
    # automatico que cria uma pasta na vm do host ou do linux wsl. Para isso deixe
    # o storageclass vazio
    # caso contrario tera q criar o pv manualmente
    storage:
        #storageClass: nfs-client
        storageClass: ""

    tz: America/Sao_Paulo

    image:
        repository: ghcr.io/pengovbr/sei-helm/solr
        pullPolicy: IfNotPresent
        tag: "0.5.0"



    nameOverride: ""
    fullnameOverride: ""

    # caso deseje desabilitar ingress para o solr passe assim:
    # ingress: {}
    ingress:
        tls_secret_name: mysecret
        host: meusolr.br

    # tune os resources e tb o memory abaixo
    # Em prd eh bom o Solr ficar sozinho em um node.
    # Resources desabilitados por default
    resources: {}
    # para habilitar seque exemplo abaixo
    # Ex:
    # resources:
    #   limits:
    #     cpu: 500m
    #     memory: 2048Mi
    #   requests:
    #     cpu: 500m
    #     memory: 2048Mi


    # memoria para a jvm do solr
    # A qtde de memoria que vc fornecer ao solr sera decisiva
    # para o seu correto funcionamento
    memory: 512m

    # os probes abaixo sao todos dinamicos
    # serao integralmente enviados para o pod
    # caso deseje desabilitar algum probe basta:
    # startupProbe: {}
    startupProbe:
      exec:
        command:
        - /probes/startup.sh
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 15
      successThreshold: 1
      failureThreshold: 300

    livenessProbe:
      exec:
        command:
        - /probes/liveness.sh
      initialDelaySeconds: 30
      periodSeconds: 60
      timeoutSeconds: 15
      failureThreshold: 3
      successThreshold: 1

    readinessProbe:
      exec:
        command:
        - /probes/readiness.sh
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 10
      successThreshold: 1
      failureThreshold: 6

    # usuario para os probes
    solrProbeUser: admin
    solrProbePass: SolrAdmin123$