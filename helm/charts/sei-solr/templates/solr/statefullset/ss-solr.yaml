apiVersion: apps/v1
kind: Deployment
metadata:
  name: solr
  labels:
    {{- include "sei-solr.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      servico: solr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        servico: solr
        {{- include "sei-solr.labels" . | nindent 8 }}
    spec:
      imagePullSecrets:
      - name: {{ .Values.solr.image.secret }}
      containers:
      - image: "{{ .Values.solr.image.repository }}:{{ .Values.solr.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.solr.image.pullPolicy }}
        envFrom:
        - configMapRef:
            name: cm-solr
        - secretRef:
            name: se-solr
            optional: false
        name: solr
        args: [ "-Duser.timezone=GMT-03:00", "-m", "{{ .Values.solr.memory }}" ]
        {{- with .Values.solr.resources }}
        resources:
        {{- . | toYaml | nindent 10 }}
        {{- end }}
        {{- with .Values.solr.startupProbe }}
        startupProbe:
        {{- . | toYaml | nindent 10 }}
        {{- end }}
        {{- with .Values.solr.livenessProbe }}
        livenessProbe:
        {{- . | toYaml | nindent 10 }}
        {{- end }}
        {{- with .Values.solr.readinessProbe }}
        readinessProbe:
        {{- . | toYaml | nindent 10 }}
        {{- end }}
        stdin: true
        tty: true
        volumeMounts:
        - mountPath: /var/solr/data
          name: vol1
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - bash
        - -c
        - echo "Vamos verificar se existe uma pasta com os dados do solr."; echo
          "Caso nao exista vamos criar..."; if [[ "$(ls -A /t)" = "" ]]; then
          echo "Diretorio vazio, vamos copiar os dados do solr..."; cp -a /var/solr/data/*
          /t/ && echo "Dados copiados!"; else echo "Diretorio nao esta vazio. " ;
          echo "Arquivos encontrados"; echo $(ls -lha /t); echo "Nao vamos alterar
          nada. " ; echo "Caso o solr nao suba, verifique se nesse dir existe um
          solr e que as permissoes do arquivo estejam com o Solr" ; fi;  exit 0
        image: "{{ .Values.solr.image.repository }}:{{ .Values.solr.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.solr.image.pullPolicy }}
        name: solr-init
        envFrom:
        - configMapRef:
            name: cm-solr
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 100m
            memory: 64Mi
        stdin: true
        tty: true
        volumeMounts:
        - mountPath: /t
          name: vol1
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      volumes:
      - name: vol1
        persistentVolumeClaim:
          claimName: vol-sei-solr