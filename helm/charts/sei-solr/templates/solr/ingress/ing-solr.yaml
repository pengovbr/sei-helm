{{- with .Values.solr.ingress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 510m
    {{- with .opcionais }}
    {{- . | toYaml | nindent 4 }}
    {{- end }}
  name: ing-solr
  labels:
    {{- include "sei-solr.labels" $ | nindent 4 }}
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - {{ .host }}
    secretName: {{ .tls_secret_name }}
  rules:
  - host: {{ .host }}
    http:
      paths:
      - backend:
          service:
            name: solr
            port:
              number: 8983
        path: /
        pathType: Prefix
{{- end }}