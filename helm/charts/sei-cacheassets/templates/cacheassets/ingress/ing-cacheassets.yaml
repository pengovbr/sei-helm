apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 510m
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
  name: ing-cacheassets
  labels:
    {{- include "sei-cacheassets.labels" . | nindent 4 }}
spec:
  tls:
  - hosts:
    - {{ .Values.app.host }}
    secretName: {{ .Values.app.ingress.tls_secret_name }}
  rules:
  {{- range .Values.cacheassets.backends }}
  - host: {{ .host }}
    http:
      paths:
      - backend:
          service:
            name: cacheassets
            port:
              number: 80
        path: /
        pathType: Prefix
  {{- end }}
  - http:
      paths:
      - backend:
          service:
            name: cacheassets
            port:
              number: 80
        path: /
        pathType: Prefix

