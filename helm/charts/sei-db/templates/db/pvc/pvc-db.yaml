apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vol-sei-db
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  {{- with .Values.db.pvc.selector }}
  selector:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .Values.db.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}